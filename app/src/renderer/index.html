<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Navik</title>
    <script>
      // Sidebar width bounds, shared with the pane-resizer logic (the single source of truth for
      // drag behavior) via this global so the two never drift apart.
      window.NAVIK_SIDEBAR_WIDTH_BOUNDS = { min: 220, max: 420 }
    </script>
    <script>
      // Applied synchronously, before first paint, to avoid a flash of the default theme or a
      // jump from the default sidebar width to the user's saved width.
      document.documentElement.setAttribute('data-theme', localStorage.getItem('navik-theme') || 'dark')
      var savedSidebarWidth = parseInt(localStorage.getItem('navik-sidebar-width'), 10)
      if (!isNaN(savedSidebarWidth)) {
        var bounds = window.NAVIK_SIDEBAR_WIDTH_BOUNDS
        savedSidebarWidth = Math.max(bounds.min, Math.min(bounds.max, savedSidebarWidth))
        document.documentElement.style.setProperty('--sidebar-width', savedSidebarWidth + 'px')
      }
      // Restore the saved terminal panel height too — same pre-paint reason: avoid a jump from the
      // default to the user's chosen size on first open.
      var savedTerminalHeight = parseInt(localStorage.getItem('navik-terminal-height'), 10)
      if (!isNaN(savedTerminalHeight) && savedTerminalHeight >= 80) {
        document.documentElement.style.setProperty('--terminal-height', savedTerminalHeight + 'px')
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
