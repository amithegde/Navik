appId: com.navik.app
productName: Navik
copyright: Copyright © Navik

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - package.json

# node-pty ships N-API prebuilds under prebuilds/<plat>-<arch>/ that it loads at runtime (utils.js
# resolves build/Release -> prebuilds). They're ABI-stable and load fine under Electron as-is —
# verified by loading + spawning node-pty under electron.exe with no rebuild. @electron/rebuild
# nonetheless tries to rebuild it from source (it can't recognize node-pty's custom prebuild
# shape) and fails where no Visual Studio is installed. Skipping the rebuild ships the prebuilt
# binaries directly. If a native dep that genuinely needs rebuilding for Electron is ever added,
# this will need revisiting.
npmRebuild: false

# The UI is English-only; shipping just en-US drops ~46 MB of Chromium locale files
# from the unpacked app.
electronLanguages:
  - en-US
compression: maximum

win:
  executableName: navik
  icon: build/icon.ico
  target:
    - target: nsis
    - target: portable

nsis:
  artifactName: Setup.${ext}
  # NSIS emits warning 9000 for version-less installer names like "Setup.exe" (Windows applies
  # appcompat shims to them), and electron-builder treats NSIS warnings as errors by default —
  # without this the whole win build fails.
  warningsAsErrors: false
  shortcutName: Navik
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: ${productName}.${ext}

mac:
  icon: build/icon.png
  target:
    - target: dmg
  category: public.app-category.developer-tools

linux:
  icon: build/icon.png
  target:
    - target: AppImage
  category: Development
  executableName: navik
