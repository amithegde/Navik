appId: com.navik.app
productName: Navik
copyright: Copyright © Navik

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - package.json

# The UI is English-only; shipping just en-US drops ~46 MB of Chromium locale files
# from the unpacked app.
electronLanguages:
  - en-US
compression: maximum

win:
  executableName: navik
  icon: build/icon.ico
  target:
    - target: nsis
    - target: portable

nsis:
  artifactName: Setup.${ext}
  # NSIS emits warning 9000 for version-less installer names like "Setup.exe" (Windows applies
  # appcompat shims to them), and electron-builder treats NSIS warnings as errors by default —
  # without this the whole win build fails.
  warningsAsErrors: false
  shortcutName: Navik
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: ${productName}.${ext}

mac:
  icon: build/icon.png
  target:
    - target: dmg
  category: public.app-category.developer-tools

linux:
  icon: build/icon.png
  target:
    - target: AppImage
  category: Development
  executableName: navik
